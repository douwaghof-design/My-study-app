<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="home-screen" class="layout active">
            <header>
                <h1>Hi, Ghoffy!</h1>
                <p>Let's do a great work today! ✨</p>
            </header>
            <div class="button-group">
                <button id="start-btn">Start</button>
                <button id="quit-btn">Quit</button>
            </div>
            <div class="decorations">🌸 ✿ 🌸 ✿ 🌸</div>
        </div>

        <div id="work-screen" class="layout">
            </div>
    </div>
    <script src="script.js"></script>
</body>
<div id="work-screen" class="layout">
    <button id="back-home">← Home</button>
    
    <div class="subject-area">
        <input type="text" id="subject-input" placeholder="Enter Subject Name...">
        <div id="color-palette"></div>
    </div>

    <div class="pomodoro-box">
        <h3>Choose your Focus:</h3>
        <button class="timer-opt" data-mins="55">55 min (5 min break)</button>
        <button class="timer-opt" data-mins="120">2 hours (10 min break)</button>
    </div>

    <div id="status-message"></div>
</div>
</html>
